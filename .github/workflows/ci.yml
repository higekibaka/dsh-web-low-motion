name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: dsh-v0.1.6-alpha.2
            commit: ddefc45fbc7f8e46dd73185e68295696d1297887
          - target: dsh-v0.1.7-rc.1
            commit: 46a7f68b0922371ce7144b668b90e377d8e799f4
          - target: dsh-v0.2.0-rc.1
            commit: 4878cdabd87d4041bdaff61d04c966883b9fd07a
            modern: smil
          - target: dsh-v0.2.0-rc.2
            commit: 639ed015397290b3745d163aafe02ffee4aa3f84
            modern: apng
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_CHECKOUT: ${{ github.workspace }}/.dsh-target
      DSH_MODERN_VARIANT: ${{ matrix.modern || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:build
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.commit }}
          path: .dsh-target
      - name: Install isolated DSH test dependencies
        working-directory: .dsh-target
        run: pnpm install --ignore-scripts --frozen-lockfile=false
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Verify tag and pack
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          fi
          mkdir -p .artifacts/release
          npm pack --ignore-scripts --pack-destination .artifacts/release
          cd .artifacts/release
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'dsh-v0.2.0-rc.2'
        with:
          name: release-package
          path: .artifacts/release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-package
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "DSH 性能优化 ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "DSH 性能优化 ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-package/* --clobber
