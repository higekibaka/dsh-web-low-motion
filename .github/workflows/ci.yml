name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_CHECKOUT: ${{ github.workspace }}/.dsh-target
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:build
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ddefc45fbc7f8e46dd73185e68295696d1297887
          path: .dsh-target
      - name: Build isolated DSH target
        working-directory: .dsh-target
        run: |
          pnpm install --ignore-scripts --frozen-lockfile=false
          pnpm build:lib
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Verify tag and pack
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          fi
          mkdir -p .artifacts/release
          npm pack --ignore-scripts --pack-destination .artifacts/release
          cd .artifacts/release
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: .artifacts/release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-package
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "DSH 性能优化 ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "DSH 性能优化 ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-package/* --clobber
